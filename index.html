<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitaneme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <!-- Background Petals Canvas (always active) -->
    <canvas id="bgCanvas"></canvas>

    <!-- Ambient Glows -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Main Canvas for the Bouquet (drawn with JS) -->
    <div class="main-container">
        <h1 id="loveMessage" class="love-message">Esmam Seni Çok Seviyorum</h1>
        <div id="bouquetWrapper" class="bouquet-wrapper">
            <canvas id="bouquetCanvas"></canvas>
        </div>
        <div id="actionContainer" class="action-container">
            <button id="magicBtn" class="premium-btn pulse">
                <span>Bitaneme</span>
            </button>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
